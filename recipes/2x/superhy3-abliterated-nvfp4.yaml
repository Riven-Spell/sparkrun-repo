# SuperHY3-abliterated-NVFP4
# Tencent Hy3 base: 295B MoE / 21B active, 192 routed experts (top-8) + 1 shared
# NVFP4 W4A16 (weight-only) via compressed-tensors -> serves through MARLIN NVFP4
# Routed experts are NVFP4 E2M1 with FP8-E4M3 group scales; rest is BF16/F32
# ~181GB => 84.5GB per rank on a 2xDGX-Spark (128GB) with TP2
# MTP speculative (native Hy3 nextn-predict); keep KV cache BF16 on GB10
# Model details: https://huggingface.co/Jiunsong/SuperHY3-abliterated-NVFP4

model: Jiunsong/SuperHY3-abliterated-NVFP4
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:20260810
min_nodes: 2
recipe_version: '2'

mods:
  - fastokens

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.91
  max_model_len: 250000
  max_num_batched_tokens: 8192
  max_num_seqs: 4
  block_size: 256
  max_cudagraph_capture_size: 16
  kv_cache_dtype: fp8
  load_format: instanttensor
  attn_backend: flashinfer
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
  default_chat_template_kwargs: '{"reasoning_effort": "high"}'
  served_model_name: 'tencent/Hy3'

command: |
  vllm serve {model} \
    --served-model-name '{served_model_name}' \
    --host {host} \
    --port {port} \
    -tp {tensor_parallel} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --kv-cache-dtype {kv_cache_dtype} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --load-format {load_format} \
    --max-cudagraph-capture-size {max_cudagraph_capture_size} \
    --speculative-config '{speculative_config}' \
    --default-chat-template-kwargs '{default_chat_template_kwargs}' \
    --block-size {block_size} \
    --generation-config vllm \
    --attention-backend '{attn_backend}' \
    --enable-flashinfer-autotune \ 
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --trust-remote-code \
    --tool-call-parser hy_v3 \
    --reasoning-parser hy_v3

env:
  INSTANTTENSOR_CHUNK_SIZE: "16777216"
  INSTANTTENSOR_IO_DEPTH: 5
  PYTORCH_CUDA_ALLOC_CONF: 'expandable_segments:True,max_non_split_rounding_mb:2048,graph_capture_record_stream_reuse:True,pinned_use_background_threads:True,pinned_use_cuda_host_register:True'
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  DG_JIT_USE_NVRTC: "0"
  TILELANG_CLEANUP_TEMP_FILES: "1"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  VLLM_SKIP_INIT_MEMORY_CHECK: "1"
  VLLM_USE_FASTOKENS: "1"
  VLLM_FLASHINFER_DECODE_USE_TENSOR_CORES: "1"

metadata:
  description: SuperHY3-abliterated-NVFP4 (Hy3 295B NVFP4 W4A16)
