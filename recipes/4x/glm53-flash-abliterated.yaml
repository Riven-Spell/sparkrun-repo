name: GLM 5.3 Flash Abliterated (OrcaRouter)
description: GLM 5.3 Flash Abliterated; needs hf auth + action on model page
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x:2026100502
model: orcarouter/GLM-5.3-Flash-Uncensored-FP8
solo_only: false
cluster_only: true
recipe_version: '2'

runtime: vllm
executor_config:
  ulimit:
    - memlock=-1:-1
    - nofile=262144:262144

mods: ['fastokens', 'vllm-skip-memory-check']

defaults:
  served_model_name: 'zai-org/GLM-5.3-Flash'
  port: 8000
  host: 0.0.0.0
  gpu_memory_utilization: 0.9
  tensor_parallel: 4
  pipeline_parallel: 1
  data_parallel: 1
  tool_call_parser: glm47
  reasoning_parser: glm47
  load_format: instanttensor
  kv_cache_dtype: fp8
  moe_backend: deep_gemm
  linear_backend: b12x
  attention_backend: B12X
  max_model_len: 250000
  max_num_batched_tokens: 8192
  max_num_seqs: 4
  block_size: 2048
  speculative_config: '{"method":"dflash","model":"incoai/GLM-5.3-Flash-DFlash2","num_speculative_tokens":3,"moe_backend":"deep_gemm","kv_cache_dtype":"bfloat16"}'
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE", "custom_ops": ["all"]}'
  default_chat_template_kwargs: '{"reasoning_effort": "high"}'

command: |
  vllm serve {model} \
    --served-model-name '{served_model_name}' \
    --host {host} --port {port} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    -tp {tensor_parallel} \
    -dp {data_parallel} \
    -pp {pipeline_parallel} \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --load-format {load_format} \
    --kv-cache-dtype {kv_cache_dtype} \
    --moe-backend {moe_backend} \
    --linear-backend {linear_backend} \
    --attention-backend {attention_backend} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --block-size {block_size} \
    --speculative-config '{speculative_config}' \
    --compilation-config '{compilation_config}' \
    --default-chat-template-kwargs '{default_chat_template_kwargs}' \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --enable-flashinfer-autotune \
    --enable-prompt-tokens-details \
    --enable-auto-tool-choice \
    --async-scheduling \
    --trust-remote-code \
    -O3

env:
  PYTORCH_CUDA_ALLOC_CONF: 'expandable_segments:True,max_non_split_rounding_mb:2048,graph_capture_record_stream_reuse:True,pinned_use_background_threads:True,pinned_use_cuda_host_register:True'
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  DG_JIT_USE_NVRTC: "0"
  TILELANG_CLEANUP_TEMP_FILES: "1"
  CUTE_DSL_ARCH: 'sm_121a'
  TORCH_CUDA_ARCH_LIST: '12.1a'
  FLASHINFER_CUDA_ARCH_LIST: '12.1a'
  VLLM_USE_V2_MODEL_RUNNER: '1'
  VLLM_USE_AOT_COMPILE: '1'
  VLLM_USE_FASTOKENS: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  B12X_MLA_SM120_UNIFIED: "1"
  VLLM_STRICT_MEMORY_CHECK: "0"
  VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  OMP_NUM_THREADS: "10"
  B12X_AUTOTUNE_RANK0_ONLY: "1"
