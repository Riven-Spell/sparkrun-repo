name: Minimax M3
description: Minimax M3 for 4x spark cluster
container: vllm-dspark-runtime:minimax_m3
builder: eugr
solo_only: false
cluster_only: false

model: ressl/MiniMax-M3-uncensored-NVFP4

runtime_config:
  build_args: [ ]

executor_config:
  ulimit:
    - memlock=-1:-1
    - nofile=262144:262144

mods:
  - fastokens
  - sparkinfer-install

env:
  PYTORCH_CUDA_ALLOC_CONF: 'expandable_segments:True,max_non_split_rounding_mb:2048,graph_capture_record_stream_reuse:True,pinned_use_background_threads:True,pinned_use_cuda_host_register:True'
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  VLLM_USE_FASTOKENS: '1'
  VLLM_USE_V2_MODEL_RUNNER: '1'
  VLLM_USE_B12X_MOE: '1'
  VLLM_USE_B12X_SPARSE_INDEXER: '1'
  B12X_W4A16_TC_DECODE: "0"
  DG_JIT_USE_NVRTC: "0"
  TILELANG_CLEANUP_TEMP_FILES: "1"
  TORCH_CUDA_ARCH_LIST: '12.1a'
  FLASHINFER_CUDA_ARCH_LIST: '12.1a'
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  VLLM_FLASHINFER_DECODE_USE_TENSOR_CORES: "1"
  NCCL_CUMEM_ENABLE: '0'
  VLLM_MINIMAX_M3_ENABLE_TORCH_COMPILE: '1'
  VLLM_USE_AOT_COMPILE: '1'
  VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
  VLLM_USE_B12X_MOE: '1'
  VLLM_USE_B12X_MINIMAX_M3_MSA: '1'
  VLLM_USE_B12X_SPARSE_INDEXER: '1'
  VLLM_USE_B12X_FP8_GEMM: '0'
  VLLM_ENABLE_PCIE_ALLREDUCE: '0'
  VLLM_B12X_CUDAGRAPH_PIECEWISE_PREWARM: '1'
  B12X_LOG_CUTE_COMPILES_AFTER_ENGINE_START: '1'
  VLLM_USE_V1: '0'

defaults:
  host: 0.0.0.0
  port: 8000
  load_format: instanttensor
  tensor_parallel: 4
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8
  kv_cache_dtype: fp8
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 4096
  block_size: 128
  performance_mode: interactivity
  default_chat_template_kwargs: '{ "enable_thinking": true }'
  moe_backend: flashinfer_b12x
  attention_backend: FLASHINFER
  compilation_config: '{"cudagraph_mode": "FULL", "custom_ops": ["all"], "max_cudagraph_capture_size": 8}'
  speculative_config: '{"method": "dspark", "num_speculative_tokens": 5, "model": "nvidia/MiniMax-M3-DSpark"}'

command: |
  vllm serve {model} \
    --served-model-name MiniMaxAI/MiniMax-M3 \
    --host {host} --port {port} \
    --reasoning-parser minimax_m3 \
    --tool-call-parser minimax_m3 \
    --load-format {load_format} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-dtype {kv_cache_dtype} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --block-size {block_size} \
    --moe_backend {moe_backend} \
    --attention-backend {attention_backend} \
    -cc '{compilation_config}' \
    -sc '{speculative_config}' \
    --performance-mode {performance_mode} \
    --language-model-only \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --enable-flashinfer-autotune \
    --trust-remote-code \
    --enable-prompt-tokens-details \
    -O3

