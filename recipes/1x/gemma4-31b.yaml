metadata:
  description: Gemma4-31B-it
model: kakrotto/gemma-4-31B-it-uncensored-heretic-FP8
command: |
  vllm serve {model} \
    --served-model-name "google/gemma-4-31B" \
    --max-model-len {max_model_len} \
    --kv-cache-dtype {kv_cache_dtype} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --host {host} \
    --port {port} \
    --load-format {load_format} \
    --enable-prefix-caching \
    --tool-call-parser {tool_call_parser} \
    --enable-auto-tool-choice \
    --reasoning-parser {reasoning_parser} \
    --async-scheduling \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel} \
    --attention-backend {attn_backend} \
    --enable-flashinfer-autotune \
    --default-chat-template-kwargs '{chat_template_args}' \
    --chat-template chat_template.jinja \
    --trust-remote-code \
    --speculative-config '{speculative_config}' \
    --compilation-config '{compilation_config}' \
    --async-scheduling \
    --enable-chunked-prefill \
    --block-size 512 \
    -O3
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:2026081102
recipe_version: '2'
defaults:
  host: 0.0.0.0
  tool_call_parser: gemma4
  port: 8000
  pipeline_parallel: 1
  load_format: instanttensor
  reasoning_parser: gemma4
  kv_cache_dtype: fp8
  gpu_memory_utilization: 0.8
  tensor_parallel: 1
  max_num_batched_tokens: 32768
  max_model_len: 262144
  max_num_seqs: 10
  attn_backend: TRITON_ATTN
  chat_template_args: '{"enable_thinking": true}'
  speculative_config: '{"method": "dspark", "model": "olka-amd/dspark-gemma-4-31b-it", "num_speculative_tokens": 7}'
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  VLLM_USE_FASTOKENS: '1'
mods:
  - mods/gemma4-jinja
  - fastokens
