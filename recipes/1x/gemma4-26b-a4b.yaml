metadata:
  description: Gemma4-26B-A4B-it (DSpark speculative decoding)
model: unsloth/gemma-4-26B-A4B-it
command: |
  vllm serve {model} \
    --served-model-name "google/gemma-4-26B-A4B-it" \
    --max-model-len {max_model_len} \
    --kv-cache-dtype {kv_cache_dtype} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --host {host} \
    --port {port} \
    --load-format {load_format} \
    --enable-prefix-caching \
    --tool-call-parser {tool_call_parser} \
    --enable-auto-tool-choice \
    --reasoning-parser {reasoning_parser} \
    --async-scheduling \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel} \
    --attention-backend {attn_backend} \
    --default-chat-template-kwargs '{chat_template_args}' \
    --chat-template chat_template.jinja \
     --trust-remote-code \
    --enable-chunked-prefill \
    --block-size {block_size} \
    --max-cudagraph-capture-size {max_cudagraph_capture_size} \
    --enable-flashinfer-autotune \
    --speculative-config '{speculative_config}' \
    --compilation-config '{compilation_config}' \
    -ep \
    -O3
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:2026081102
recipe_version: '2'
defaults:
  host: 0.0.0.0
  tool_call_parser: gemma4
  port: 8000
  pipeline_parallel: 1
  load_format: instanttensor
  reasoning_parser: gemma4
  kv_cache_dtype: auto
  gpu_memory_utilization: 0.9
  tensor_parallel: 1
  max_num_batched_tokens: 32768
  max_model_len: 262144
  max_num_seqs: 10
  max_cudagraph_capture_size: 8
  block_size: 256
  attn_backend: TRITON_ATTN
  chat_template_args: '{"enable_thinking": true}'
  speculative_config: '{"method": "dspark", "num_speculative_tokens": 3, "model": "makora-ai/gemma4-26b-a4b-dspark"}'
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
env:
  PYTORCH_CUDA_ALLOC_CONF: 'expandable_segments:True'
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '1'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  VLLM_USE_FASTOKENS: '1'
  VLLM_FLASHINFER_DECODE_USE_TENSOR_CORES: '1'
  VLLM_USE_V2_MODEL_RUNNER: '1'
  TILELANG_CLEANUP_TEMP_FILES: "1"
  TORCH_CUDA_ARCH_LIST: '12.1a'
  
mods:
  - fastokens
  - gemma4-jinja
